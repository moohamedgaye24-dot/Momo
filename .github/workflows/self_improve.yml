name: Autonomous Self-Improvement Loop

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight (UTC)
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  meta_learning:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Weekly LSTM Model Retraining
        if: github.event.schedule == '0 0 * * 0' # Only run on Sundays
        run: |
          # Retrain the Real PyTorch LSTM model with the latest XAUUSD data
          python lstm_trainer.py

      - name: Create Pull Request with Autonomous Evolutions
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Autonomous Evolution: Strategy Hardening & Meta-Learning Update"
          title: "[BOT] Daily Strategy Optimization & Meta-Learning Update"
          body: |
            This PR was automatically generated by the Autonomous Self-Improvement Loop.

            **Actions Performed:**
            - Executed the Walk-Forward backtest analysis.
            - Evaluated 'Surprise Ratios' and updated `learnings.md`.
            - Generated 1,000 synthetic future paths via `oracle_push.py`.
            - Autonomously rewrote `strategy.py` entry logic if failure rates exceeded tolerances.
            - Adjusted Darwinian Research Weights based on trace accuracy.

            Please review the code changes and test results before merging into the main branch.
          branch: "autonomous-evolution-${{ github.run_id }}"
          delete-branch: true
